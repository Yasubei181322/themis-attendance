services:
  - type: web
    name: themis-attendance
    env: node
    buildCommand: npm install && npm run build
    startCommand: node api.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: themis-db
          property: connectionString

databases:
  - name: themis-db
    databaseName: themis
    user: themis
